<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SerratecFlix</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar">
    <span class="logo">SerratecFlix</span>

    <div class="nav-links">
        <a href="#">Início</a>
        <a href="#">Filmes</a>
        <a href="#">Séries</a>
        <a href="#">Minhas Listas</a>
    </div>

    <div class="nav-right">
        <input type="text" class="search-input" placeholder="Buscar..."/>
        <button class="btn-login">Entrar</button>
    </div>
</nav>

<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <span class="hero-badge">Em destaque</span>
        <h1 class="hero-title">Interestelar</h1>
        <div class="hero-meta">
            <span class="hero-nota">★ 9.2</span>
            <span>2014</span>
            <span>169 min</span>
        </div>
        <p class="hero-desc">Uma equipe de exploradores viaja através de um buraco de minhoca no espaço numa tentativa de garantir a sobrevivência da humanidade.</p>
        <div class="hero-buttons">
            <button class="btn-play">▶ Assistir</button>
            <button class="btn-fav">♡ Favoritar</button>
        </div>
    </div>
</section>

<script src="js/app.js"></script>
</body>
</html>
