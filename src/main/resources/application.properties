spring.application.name=TrabalhoFinal-API

server.port=8080

# Configuração do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/TrabalhoFinalAPI
spring.datasource.username=postgres
spring.datasource.password=1234

# Cria/Atualiza as tabelas automaticamente (Ideal para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update

# Configurações de Log e Performance
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Altera o caminho para acessar o Swagger no navegador
springdoc.swagger-ui.path=/swagger-ui.html

# Altera o caminho onde o JSON do OpenAPI é gerado
springdoc.api-docs.path=/api-docs